<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PF at home</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #2c3e50; /* Sfondo scuro */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #ecf0f1;
        }
        .login-box {
            background: #34495e; /* Grigio-blu scuro per il box */
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        h1 { 
            margin-top: 0; 
            font-size: 2rem;
            color: #ffffff;
            letter-spacing: 1px;
        }
        p {
            color: #bdc3c7;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: white;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-judge { background-color: #27ae60; }
        .btn-admin { background-color: #2c3e50; border: 2px solid #7f8c8d; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>PF at home</h1>
        <p>Seleziona il tuo ruolo<p>
        <a href="tracker.html?role=judge" class="btn btn-judge">Accesso Judge</a>
        <a href="tracker.html?role=admin" class="btn btn-admin">Accesso Admin</a>
    </div>
</body>
</html>
